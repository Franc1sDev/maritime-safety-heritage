name: Checks and builds

on:
  push:
    branches: [main]
    paths: ['backend/**', 'web/**', 'mobile-app/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API and website tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK (test build, debug-signed; the release key stays on the PC)
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || '' }}
      - name: Build the Google Play bundle
        run: flutter build appbundle --release --dart-define=API_URL=${{ vars.API_URL || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: maritime-heritage-android
          retention-days: 14
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS app (unsigned build)
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ vars.API_URL || '' }}

  server-image:
    name: Server image and hosting config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and website image
        run: docker build -t maritime-heritage .
      - name: Check the Docker Compose file
        working-directory: deploy
        run: cp .env.production.example .env && sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=x/' .env && docker compose config -q
      - name: Check the Caddy (HTTPS) config
        run: docker run --rm -e SITE_DOMAIN=archive.example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Check the backup scripts
        run: sh -n deploy/backup/backup.sh && sh -n deploy/backup/restore.sh && docker build -t maritime-backup deploy/backup
