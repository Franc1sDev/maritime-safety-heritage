name: Checks and builds

on:
  push:
    branches: [main, master-plan]
    paths: ['backend/**', 'web/**', 'mobile-app/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API and website tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities in the server's packages (high or critical fail the build)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test

  web:
    name: Website (type check, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities in the website's packages (high or critical fail the build)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests (journeys, accessibility, access rules, slow and offline networks, load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the server and the website
        run: |
          (cd backend && npm ci --no-audit --no-fund && npm run build)
          (cd web && npm ci --no-audit --no-fund && npm run build)
      - name: Start the demo server with the sample data
        run: |
          cd backend
          RATE_LIMIT_SCALE=100000 nohup node scripts/demo.mjs > ../server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:4000/api/v1/auth/providers > /dev/null && break; sleep 3; done
          curl -sf localhost:4000/api/v1/auth/providers
      - name: Install the test browser and the accessibility checker
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e && npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 axe-core@4 lighthouse@12
          npx playwright install --with-deps chromium
      - name: Journeys, accessibility and network tests in a real browser
        run: NODE_PATH=/tmp/e2e/node_modules LOG=$PWD/server.log AXE=/tmp/e2e/node_modules/axe-core/axe.min.js NET_LIMIT=9000 node web/e2e/journeys.cjs
      - name: Access test (every route as a visitor, Contributor, admin and Super Admin, then with nonsense input)
        run: python3 tests/security/access-matrix.py http://localhost:4000 $PWD/server.log
      - name: The API reference matches the server
        run: python3 scripts/api-reference.py && git diff --exit-code docs/API.md
      - name: Lighthouse on a simulated phone (performance 80+, accessibility, best practices and SEO 95+)
        run: NODE_PATH=/tmp/e2e/node_modules LIGHTHOUSE=/tmp/e2e/node_modules/.bin/lighthouse node tests/perf/lighthouse.cjs http://localhost:4000/
      - name: Load test (200 people for 30 seconds; 95% of requests must be under 300 ms with no server errors)
        run: node tests/load/node-load.mjs --users 200 --seconds 30 --think 2000
      - name: OWASP ZAP baseline scan (passive web vulnerability scan; any high-risk finding fails the build)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4000/ -m 2 -I -J zap.json -r zap.html || true
          python3 -c "
          import json, sys
          d = json.load(open('zap/zap.json'))
          alerts = [a for s in d.get('site', []) for a in s.get('alerts', [])]
          for a in sorted(alerts, key=lambda a: -int(a['riskcode'])): print(f\"risk {a['riskcode']}: {a['name']} ({a.get('count', '?')})\")
          high = [a for a in alerts if int(a['riskcode']) >= 3]
          sys.exit(f'{len(high)} high-risk findings' if high else 0)
          "
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: zap-report, path: zap/, if-no-files-found: ignore }
      - if: failure()
        run: tail -n 80 server.log

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK (test build, debug-signed; the release key stays on the PC)
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || '' }}
      - name: Build the Google Play bundle
        run: flutter build appbundle --release --dart-define=API_URL=${{ vars.API_URL || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: maritime-heritage-android
          retention-days: 14
          path: |
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
            mobile-app/build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS app (unsigned build)
    # The repository is private, where Mac build minutes count ten times: this job runs only when started by hand
    # (Actions › Checks and builds › Run workflow), before each iPhone release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ vars.API_URL || '' }}

  server-image:
    name: Server image and hosting config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and website image
        run: docker build -t maritime-heritage .
      - name: Check the Docker Compose file
        working-directory: deploy
        run: cp .env.production.example .env && sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=x/' .env && docker compose config -q
      - name: Check the Caddy (HTTPS) config
        run: docker run --rm -e SITE_DOMAIN=archive.example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Check the backup scripts
        run: sh -n deploy/backup/backup.sh && sh -n deploy/backup/restore.sh && docker build -t maritime-backup deploy/backup
