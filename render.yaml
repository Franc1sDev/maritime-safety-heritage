# Free test hosting on Render (https://render.com): the API and website in one Docker service.
# The database and media files are on Neon (free PostgreSQL, plus S3-compatible object storage).
# Render: New, Blueprint, pick this repository. Fill in the values marked sync: false when asked.
services:
  - type: web
    name: maritime-heritage
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # PostgreSQL connection string from Neon (Connection details, with ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Secrets: generated once by Render. Copy MEDIA_ENCRYPTION_KEY into a password manager.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: MEDIA_ENCRYPTION_KEY
        generateValue: true
      # Media on Neon object storage (S3-compatible), bucket "media" on the production branch
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        value: https://br-broad-boat-b9by27rh.storage.c-7.eu-central-1.aws.neon.tech
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "200"
      # Email for password resets and review results (for example Gmail with an app password)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # First admin account, created on the first start only. Set its password with "Forgot your password?".
      - key: SEED_ADMIN_EMAIL
        sync: false
      # Sample (placeholder) records so the test site is not empty; set to false before real use
      - key: SEED_SAMPLE_DATA
        value: "true"
      # The free plan has 512 MB of memory, too little for the ClamAV virus scanner (it needs a paid server)
      - key: CLAMAV_REQUIRED
        value: "false"
