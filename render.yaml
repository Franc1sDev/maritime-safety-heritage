# Free test hosting on Render (https://render.com): the API and website in one Docker service, plus a free
# PostgreSQL database that also holds the (encrypted) media files. Nothing needs to be pasted by hand:
# Render generates every secret and links the database itself.
#
# Limits of the free plan: the service sleeps after 15 minutes without visitors (about a minute to wake),
# the free database holds 1 GB and expires 30 days after creation unless upgraded, and there is no virus
# scanner (not enough memory). Move to a paid server before real use (see docs/DEPLOYMENT.md).
databases:
  - name: maritime-heritage-db
    plan: free
    region: frankfurt
    databaseName: maritime_heritage
    user: maritime

services:
  - type: web
    name: maritime-heritage
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: maritime-heritage-db
          property: connectionString
      # Secrets: generated once by Render
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: MEDIA_ENCRYPTION_KEY
        generateValue: true
      # Media files are encrypted and stored inside the database
      - key: STORAGE_DRIVER
        value: database
      - key: MAX_UPLOAD_MB
        value: "100"
      # First admin account. Its password is generated by Render: see SEED_ADMIN_PASSWORD under Environment.
      - key: SEED_ADMIN_EMAIL
        value: contactfrancismutuku@gmail.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      # Email (password reset links, review results). Add SMTP_PASSWORD (a Gmail app password) to turn it on.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: contactfrancismutuku@gmail.com
      - key: MAIL_FROM
        value: Maritime Safety Heritage Archive <contactfrancismutuku@gmail.com>
      # Sample (placeholder) records so the test site is not empty; set to false before real use
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: CLAMAV_REQUIRED
        value: "false"
